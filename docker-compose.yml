services:
  filesystem-mcp:
    image: ghcr.io/carldog/filesystem-mcp:latest
    pull_policy: always
    container_name: filesystem-mcp
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3006}:3000"
    environment:
      MCP_PORT: "3000"
      FS_ROOTS: "${FS_ROOTS}"
      FS_ALLOW_WRITE: "${FS_ALLOW_WRITE:-false}"
      FS_DENY_FILE_PATTERNS: "${FS_DENY_FILE_PATTERNS:-*.env,*.key,*.pem,*.pfx,*.p12,id_rsa*,id_dsa*,id_ecdsa*,id_ed25519*,known_hosts,authorized_keys,.htpasswd,*.kdbx}"
      FS_MAX_READ_BYTES: "${FS_MAX_READ_BYTES:-1048576}"
      FS_MAX_LIST_ENTRIES: "${FS_MAX_LIST_ENTRIES:-1000}"
    # IMPORTANT: mount your data into the container.
    #
    # The container can ONLY see what you mount, and FS_ROOTS scopes
    # *within* what's mounted. The bind specs are parameterized — set
    # FS_VOLUME on the stack/env to a `host:container[:flags]` string,
    # e.g. `/volume1/Media:/media:ro`. The compose deploy will fail
    # loudly if FS_VOLUME is unset (no silent empty-mount surprises).
    #
    # For multiple roots: set FS_VOLUME_2 / _3 to additional bind
    # specs in the same format. They're optional — when unset, the
    # sentinel `/dev/null:/dev/null:ro` no-op mount is used (harmless;
    # Docker is happy to bind /dev/null read-only as a placeholder).
    # FS_ROOTS should then list every mounted-into-container path,
    # comma-separated (e.g. `FS_ROOTS=/media,/portainer-compose`).
    #
    # Read-only is strongly recommended until write tools are reviewed.
    volumes:
      - "${FS_VOLUME:?FS_VOLUME must be set, e.g. /volume1/Media:/media:ro}"
      - "${FS_VOLUME_2:-/dev/null:/dev/null:ro}"
      - "${FS_VOLUME_3:-/dev/null:/dev/null:ro}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
