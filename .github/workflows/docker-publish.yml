# Build and publish the container image — standards MCP-E04 + UNI-14.
#
# THE TEST GATE IS THE POINT. This used to run independently of test.yml, so
# a commit whose tests were red still produced a :latest that the NAS stack
# then pulled. build-and-push now depends on the `test` job below — a red
# commit can no longer ship.

name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Docs-only changes can't affect the image (the build context is just
    # Dockerfile + package*.json + tsconfig + src). Skipping them avoids
    # republishing :latest, which would otherwise force-pull + bounce the
    # auto-deploying stack for a pure documentation commit.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".env.example"
      - ".gitattributes"
      - ".githooks/**"
      - ".gitleaks.toml"
      - ".github/dependabot.yml"
      - ".github/FUNDING.yml"
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # node 22 ships npm 10.9.8. Match test.yml's pin — see
  # claude-fleet-kit fleet/lessons/npm-version-skew.
  PINNED_NPM: "11.19.0"

permissions:
  contents: read

jobs:
  # Gate. Publishing depends on this passing.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"

      - name: Pin npm (match local — see lessons/npm-version-skew)
        run: npm install --global "npm@${{ env.PINNED_NPM }}"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  build-and-push:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # UNI-19: a release must not move a mutable deployment tag. `flavor`
          # defaults to latest=auto, which applies :latest on ANY type=semver
          # event -- independently of the type=raw rule below, whose
          # is_default_branch is correctly false on a tag push. Left at the
          # default, `git push origin v1.2.3` republishes :latest from a second
          # build of the same commit, at a different digest, and bounces every
          # stack watching that tag.
          flavor: latest=false
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=main-,format=short,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # amd64 only. Every deployment target is x86-64 (the containers
          # run as Portainer stacks on an amd64 host); nothing in the fleet
          # runs on ARM, so a QEMU-emulated arm64 build is ~5x slower for an
          # image no one pulls. Re-add linux/arm64 here if an ARM host ever
          # joins the fleet. See lessons/docker-multiarch-only-what-you-deploy.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
